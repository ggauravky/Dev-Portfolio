<!doctype html>
<!--
  Offline fallback page — Gaurav Kumar Yadav Portfolio
  Served by the service worker ONLY on genuine network failures (TypeError).
  Never served for HTTP 4xx/5xx responses (those pass through unchanged).
  No external network dependencies: the self-hosted fonts are used when the
  browser has them cached, otherwise the system fallbacks render.
  v2 Monograph styling (P6); keep in step with public/404.html.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0E0D0B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>You're offline — Gaurav Kumar Yadav</title>
    <style>
      @font-face { font-family: 'Fraunces'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('/fonts/fraunces-var.woff2') format('woff2'); }
      @font-face { font-family: 'Geist'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('/fonts/geist-var.woff2') format('woff2'); }
      @font-face { font-family: 'Geist Mono'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('/fonts/geist-mono-var.woff2') format('woff2'); }
      :root { --ink: #0E0D0B; --rule: #2A2824; --paper: #EDEAE3; --muted: #9C978C; --accent: #C6F432; }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; background: var(--ink); color: var(--paper); }
      body { font: 400 17px/1.6 'Geist', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      a { color: inherit; }
      a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
      .wrap { max-width: 1200px; margin: 0 auto; padding: 96px 16px 128px; }
      .rail { margin: 0 0 16px; color: var(--muted); font: 400 13px/1.5 'Geist Mono', 'Courier New', monospace; }
      h1 { margin: 0; font: 400 clamp(3rem, 8vw, 6rem)/0.95 'Fraunces', Georgia, serif; letter-spacing: -0.02em; }
      .lede { max-width: 46ch; margin: 24px 0 0; font-size: 20px; line-height: 1.5; }
      .note { max-width: 56ch; margin: 16px 0 0; color: var(--muted); }
      .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; margin-top: 32px; }
      .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 4px; background: var(--paper); color: var(--ink); font: 500 15px/1 'Geist', Arial, sans-serif; cursor: pointer; }
      .btn:hover { background: #fff; }
      .btn:disabled { opacity: .6; cursor: progress; }
      .link { display: inline-flex; align-items: center; min-height: 44px; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
      .link:hover { text-decoration-color: var(--accent); }
      .status { min-height: 1.6em; margin: 16px 0 0; color: var(--muted); font: 400 13px/1.6 'Geist Mono', 'Courier New', monospace; }
      .status[data-tone="ok"] { color: var(--paper); }
      .machine { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--rule); color: var(--muted); font: 400 13px/1.6 'Geist Mono', 'Courier New', monospace; }
      .machine a { display: inline-flex; align-items: center; min-height: 44px; margin-right: 16px; }
      @media (min-width: 1024px) {
        .wrap { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; padding: 128px 32px; }
        .rail { grid-column: 1 / span 2; padding-top: 22px; }
        .main { grid-column: 3 / span 8; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="rail">Offline</p>
      <div class="main">
        <h1>You&rsquo;re offline</h1>
        <p class="lede">Your internet connection dropped. Check it and try again.</p>
        <p class="note">Pages you&rsquo;ve visited recently may still open from the cache, so try going back to them.</p>
        <p class="actions">
          <button class="btn" id="retry-btn" type="button" onclick="handleRetry()">Try again</button>
          <a class="link" href="/">Home</a>
        </p>
        <p class="status" id="status-msg" role="status" aria-live="polite" aria-atomic="true"></p>
        <p class="machine">
          Machine-readable:
          <a href="/sitemap.xml">/sitemap.xml</a>
          <a href="/llms.txt">/llms.txt</a>
          <a href="/openapi.json">/openapi.json</a>
        </p>
      </div>
    </main>
    <script>
      let retrying = false;
      const btn = document.getElementById('retry-btn');

      function setStatus(msg, tone) {
        const el = document.getElementById('status-msg');
        el.textContent = msg;
        el.dataset.tone = tone || '';
      }

      async function handleRetry() {
        if (retrying) return;
        retrying = true;
        btn.disabled = true;
        btn.textContent = 'Checking…';
        setStatus('');
        try {
          // Ping a small static asset to verify real connectivity.
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 5000);
          const response = await fetch('/favicon.svg', { method: 'HEAD', cache: 'no-store', signal: controller.signal });
          clearTimeout(timeout);
          if (!response.ok) throw new Error('Not OK');
          setStatus('Back online. Reloading…', 'ok');
          setTimeout(() => {
            // Reload the page the user was trying to visit, or the homepage.
            const target = (typeof _offlinePage !== 'undefined' && _offlinePage) || '/';
            window.location.href = target;
          }, 600);
        } catch {
          setStatus('Still no connection. Try again in a moment.');
          btn.disabled = false;
          btn.textContent = 'Try again';
          retrying = false;
        }
      }

      window.addEventListener('online', () => {
        setStatus('Connection detected. Select Try again to reload.', 'ok');
        btn.disabled = false;
      });
      window.addEventListener('offline', () => setStatus('Still offline.'));
    </script>
  </body>
</html>
