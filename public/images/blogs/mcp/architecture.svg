<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">MCP host, client, and server architecture</title>
  <desc id="desc">An AI application host contains an MCP client connected to an MCP server, which can use files, a database, or an external API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#C6F432"/>
    </marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#2A2824"/>
    </pattern>
  </defs>
  <rect width="1400" height="760" fill="#0E0D0B"/>
  <rect width="1400" height="760" fill="url(#dots)"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="58" y="54" fill="#EDEAE3" font-size="28" font-weight="700">Who talks to whom?</text>
    <text x="1340" y="54" fill="#76726A" font-size="18" text-anchor="end">MCP ARCHITECTURE</text>

    <g transform="translate(58 92)">
      <rect width="530" height="606" rx="8" fill="#161512" stroke="#4C4A46" stroke-width="2"/>
      <path d="M0 82H530" stroke="#2A2824"/>
      <rect x="0" y="0" width="10" height="606" rx="5" fill="#C6F432"/>
      <text x="42" y="48" fill="#EDEAE3" font-size="30" font-weight="700">AI Application / MCP Host</text>
      <text x="42" y="132" fill="#9C978C" font-size="22">Coordinates the assistant and its connections</text>

      <g transform="translate(72 230)">
        <rect width="386" height="230" rx="8" fill="#161512" stroke="#C6F432" stroke-width="2"/>
        <text x="193" y="82" fill="#C6F432" font-size="18" text-anchor="middle" letter-spacing="2">INSIDE THE HOST</text>
        <text x="193" y="132" fill="#EDEAE3" font-size="38" font-weight="750" text-anchor="middle">MCP Client</text>
        <text x="193" y="174" fill="#9C978C" font-size="21" text-anchor="middle">Maintains one server connection</text>
      </g>

      <text x="42" y="548" fill="#76726A" font-size="19">The host may create another client for another server.</text>
    </g>

    <path d="M588 395H698" stroke="#C6F432" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M698 437H588" stroke="#C6F432" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="643" y="370" fill="#9C978C" font-size="17" text-anchor="middle">MCP messages</text>

    <g transform="translate(712 254)">
      <rect width="310" height="280" rx="8" fill="#161512" stroke="#C6F432" stroke-width="2"/>
      <circle cx="155" cy="74" r="30" fill="none" stroke="#C6F432" stroke-width="3"/>
      <path d="M155 55v38M136 74h38" stroke="#C6F432" stroke-width="3" stroke-linecap="round"/>
      <text x="155" y="145" fill="#EDEAE3" font-size="38" font-weight="750" text-anchor="middle">MCP Server</text>
      <text x="155" y="188" fill="#9C978C" font-size="20" text-anchor="middle">Exposes permitted tools,</text>
      <text x="155" y="218" fill="#9C978C" font-size="20" text-anchor="middle">resources, and prompts</text>
    </g>

    <path d="M1022 394H1082V175H1131" fill="none" stroke="#C6F432" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1082 394V344H1131" fill="none" stroke="#C6F432" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1082 394V510H1131" fill="none" stroke="#C6F432" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(1132 115)">
      <rect width="210" height="120" rx="6" fill="#161512" stroke="#3C3A36" stroke-width="2"/>
      <text x="105" y="53" fill="#EDEAE3" font-size="30" font-weight="700" text-anchor="middle">Files</text>
      <text x="105" y="86" fill="#76726A" font-size="18" text-anchor="middle">Local context</text>
    </g>
    <g transform="translate(1132 284)">
      <rect width="210" height="120" rx="6" fill="#161512" stroke="#3C3A36" stroke-width="2"/>
      <text x="105" y="53" fill="#EDEAE3" font-size="30" font-weight="700" text-anchor="middle">Database</text>
      <text x="105" y="86" fill="#76726A" font-size="18" text-anchor="middle">Structured data</text>
    </g>
    <g transform="translate(1132 450)">
      <rect width="210" height="120" rx="6" fill="#161512" stroke="#3C3A36" stroke-width="2"/>
      <text x="105" y="53" fill="#EDEAE3" font-size="30" font-weight="700" text-anchor="middle">External API</text>
      <text x="105" y="86" fill="#76726A" font-size="18" text-anchor="middle">Existing service</text>
    </g>
  </g>
</svg>
