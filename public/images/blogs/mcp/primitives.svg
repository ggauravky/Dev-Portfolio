<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Tools, resources, and prompts</title>
  <desc id="desc">A three-column comparison: tools perform actions, resources provide information, and prompts provide reusable instructions.</desc>
  <rect width="1200" height="680" fill="#0b0b0b"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="56" y="58" fill="#F5F5F5" font-size="30" font-weight="700">Three building blocks, three different jobs</text>
    <text x="1144" y="58" fill="#71717a" font-size="18" text-anchor="end">SERVER FEATURES</text>
    <path d="M56 91H1144" stroke="#2a2a2a"/>

    <path d="M400 126V618M800 126V618" stroke="#2a2a2a" stroke-width="2"/>

    <g transform="translate(56 134)">
      <circle cx="54" cy="54" r="54" fill="#C5F82A"/>
      <path d="M35 54h38M54 35v38" stroke="#090909" stroke-width="6" stroke-linecap="round"/>
      <text x="0" y="160" fill="#F5F5F5" font-size="42" font-weight="750">Tools</text>
      <text x="0" y="204" fill="#C5F82A" font-size="24" font-weight="650">Do something</text>
      <path d="M0 236H286" stroke="#343434"/>
      <text x="0" y="286" fill="#A1A1AA" font-size="22">Functions the assistant</text>
      <text x="0" y="318" fill="#A1A1AA" font-size="22">can ask to run.</text>
      <g transform="translate(0 370)">
        <rect width="286" height="104" rx="6" fill="#141414" stroke="#343434"/>
        <text x="22" y="42" fill="#71717a" font-size="17">EXAMPLE</text>
        <text x="22" y="76" fill="#F5F5F5" font-size="22" font-weight="650">Query a database</text>
      </g>
    </g>

    <g transform="translate(456 134)">
      <circle cx="54" cy="54" r="54" fill="#161616" stroke="#C5F82A" stroke-width="3"/>
      <path d="M30 42h48v36H30zM37 33h26l8 9" fill="none" stroke="#C5F82A" stroke-width="4" stroke-linejoin="round"/>
      <text x="0" y="160" fill="#F5F5F5" font-size="42" font-weight="750">Resources</text>
      <text x="0" y="204" fill="#C5F82A" font-size="24" font-weight="650">Provide information</text>
      <path d="M0 236H286" stroke="#343434"/>
      <text x="0" y="286" fill="#A1A1AA" font-size="22">Context the application</text>
      <text x="0" y="318" fill="#A1A1AA" font-size="22">can make available.</text>
      <g transform="translate(0 370)">
        <rect width="286" height="104" rx="6" fill="#141414" stroke="#343434"/>
        <text x="22" y="42" fill="#71717a" font-size="17">EXAMPLE</text>
        <text x="22" y="76" fill="#F5F5F5" font-size="22" font-weight="650">Read a schema</text>
      </g>
    </g>

    <g transform="translate(856 134)">
      <circle cx="54" cy="54" r="54" fill="#161616" stroke="#C5F82A" stroke-width="3"/>
      <path d="M32 34h44v42H45L32 88z" fill="none" stroke="#C5F82A" stroke-width="4" stroke-linejoin="round"/>
      <path d="M42 48h24M42 59h18" stroke="#C5F82A" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="160" fill="#F5F5F5" font-size="42" font-weight="750">Prompts</text>
      <text x="0" y="204" fill="#C5F82A" font-size="24" font-weight="650">Reuse instructions</text>
      <path d="M0 236H286" stroke="#343434"/>
      <text x="0" y="286" fill="#A1A1AA" font-size="22">Templates for a repeatable</text>
      <text x="0" y="318" fill="#A1A1AA" font-size="22">way to guide a task.</text>
      <g transform="translate(0 370)">
        <rect width="286" height="104" rx="6" fill="#141414" stroke="#343434"/>
        <text x="22" y="42" fill="#71717a" font-size="17">EXAMPLE</text>
        <text x="22" y="76" fill="#F5F5F5" font-size="22" font-weight="650">Review this code</text>
      </g>
    </g>
  </g>
</svg>
