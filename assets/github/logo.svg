<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="toxicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5f82a" />
      <stop offset="100%" stop-color="#9bd410" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c5f82a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#070708" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Background Badge Container -->
  <rect width="800" height="240" rx="32" fill="#070708" stroke="#1c1c22" stroke-width="2"/>
  <circle cx="120" cy="120" r="90" fill="url(#glow)"/>

  <!-- Geometric GKY Hex Shield Mark -->
  <g transform="translate(60, 60)">
    <polygon points="60,10 110,38 110,92 60,120 10,92 10,38" fill="none" stroke="url(#toxicGrad)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 60 30 L 90 47 L 90 83 L 60 100 L 30 83 L 30 65 L 60 80 L 75 72 L 75 60 L 60 50 Z" fill="url(#toxicGrad)"/>
    <circle cx="60" cy="65" r="5" fill="#070708"/>
  </g>

  <!-- Typography -->
  <text x="210" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="2" fill="#ffffff">
    GAURAV<tspan fill="#c5f82a">.DEV</tspan>
  </text>
  <text x="212" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#a1a1aa">
    FLAGSHIP FULL-STACK &amp; SYSTEM PORTFOLIO
  </text>

  <!-- Status Pill -->
  <g transform="translate(620, 95)">
    <rect width="130" height="34" rx="17" fill="#141419" stroke="#c5f82a" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="4" fill="#c5f82a"/>
    <text x="34" y="22" font-family="monospace" font-size="12" font-weight="700" fill="#c5f82a" letter-spacing="1">v6.0.0 READY</text>
